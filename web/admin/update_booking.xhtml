        <div class="container">
            <h1 class="text-center mb-4">Update Booking</h1>
            <div class="form-container">
                <h:form>
                    <div class="form-group">
                        <h:outputLabel for="name" value="Name: " styleClass="form-label"/>
                        <h:inputText id="name" value="#{bookingController.selectedBooking.name}" styleClass="form-control" required="true"/>
                        <h:message for="name" styleClass="text-danger"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel for="phone" value="Phone: " styleClass="form-label"/>
                        <h:inputText id="phone" value="#{bookingController.selectedBooking.phone}" styleClass="form-control" required="true"/>
                        <h:message for="phone" styleClass="text-danger"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel for="email" value="Email: " styleClass="form-label"/>
                        <h:inputText id="email" value="#{bookingController.selectedBooking.email}" styleClass="form-control" required="true"/>
                        <h:message for="email" styleClass="text-danger"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel for="age" value="Age: " styleClass="form-label"/>
                        <h:inputText id="age" value="#{bookingController.selectedBooking.age}" styleClass="form-control" required="true"/>
                        <h:message for="age" styleClass="text-danger"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel for="date" value="Date: " styleClass="form-label"/>
                        <h:inputText id="date" value="#{bookingController.selectedBooking.date}" styleClass="form-control"/>
                        <h:message for="date" styleClass="text-danger"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel for="time" value="Time: " styleClass="form-label"/>
                        <h:inputText id="time" value="#{bookingController.selectedBooking.time}" styleClass="form-control"/>
                        <h:message for="time" styleClass="text-danger"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel for="status" value="Status: " styleClass="form-label"/>
                        <h:inputText id="status" value="#{bookingController.selectedBooking.status}" styleClass="form-control" required="true"/>
                        <h:message for="status" styleClass="text-danger"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel for="description" value="Description: " styleClass="form-label"/>
                        <h:inputText id="description" value="#{bookingController.selectedBooking.description}" styleClass="form-control"/>
                        <h:message for="description" styleClass="text-danger"/>
                    </div>
                    <h:commandButton value="Update Booking" action="#{bookingController.update}" styleClass="btn btn-primary"/>
                </h:form>
            </div>
        </div>
