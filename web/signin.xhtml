<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
  <h:head>
        <title>Users Booking</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

       
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />

     
        <link href="lib/animate/animate.min.css" rel="stylesheet" />
        <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet" />
        <link href="lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css" rel="stylesheet" />

      
        <link href="css/bootstrap.min.css" rel="stylesheet" />

        <!-- Template Stylesheet -->
        <link href="css/style.css" rel="stylesheet" />
    </h:head>
<h:body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="form-container bg-light p-4 rounded shadow">
                    <h2 class="text-center mb-4">انشاء حساب</h2>
                    <h:form>
                        <div class="form-group mb-3">
                            <h:outputLabel for="newUsername" value="الاسم" styleClass="form-label" />
                            <h:inputText id="newUsername" value="#{userManagementBean.user.username}" styleClass="form-control" required="true" />
                        </div>
                        <div class="form-group mb-3">
                            <h:outputLabel for="newPassword" value="كلمة المرور:" styleClass="form-label" />
                            <h:inputSecret id="newPassword" value="#{userManagementBean.user.password}" styleClass="form-control" required="true" />
                        </div>
                        <div class="form-group mb-3">
                            <h:outputLabel for="role" value="النوع" styleClass="form-label" />
                            <h:selectOneMenu id="role" value="#{userManagementBean.user.role}" styleClass="form-select">
                                <f:selectItem itemValue="User" itemLabel="مستخدم" />
                            </h:selectOneMenu>
                        </div>
                        <div class="form-group mb-3 text-center">
                            <h:commandButton value="تسجيل" action="#{userManagementBean.registerUser}" styleClass="btn btn-primary me-2" />
                           
                        </div>
                    </h:form>
                    <div class="text-center">
                        <a href="login.xhtml" class="text-decoration-none">لدي حساب</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</h:body>
       <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="lib/counterup/counterup.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="lib/tempusdominus/js/moment.min.js"></script>
    <script src="lib/tempusdominus/js/moment-timezone.min.js"></script>
    <script src="lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>

    <!-- Template Javascript -->
    <script src="js/main.js"></script>
</html>
